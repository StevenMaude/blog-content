name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Hugo
        uses: peaceiris/actions-hugo@75d2a84ef92a9a079d29703f6a26ef2291249e1c
        with:
          hugo-version: "0.147.0"
          extended: true

      - name: Build site
        run: hugo --minify
