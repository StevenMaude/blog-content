{{ define "main" }}
<div class="container">
  <article class="post">
    <h1 class="post-title">{{ .Title }}</h1>
    <hr>
    {{ if .Date.IsZero | not }}
    {{ partial "post-meta.html" . }}
    {{ end }}
    <div class="post-content">
      {{ .Content }}
    </div>
    {{ with .Params.lastmod }}
    <p class="post-updated"><em>Last updated: {{ . | time.Format "2006-01-02" }}</em></p>
    {{ end }}
  </article>
</div>
{{ end }}
