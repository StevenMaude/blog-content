{{ define "main" }}
<h1>{{ .Title }}</h1>
{{ if .Pages }}
<ul class="post-list">
  {{ range .Pages }}
  <li class="post-item">
    <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006-01-02" }}</time>
    <a href="{{ .Permalink }}">{{ .Title }}</a>
    {{ with .Description }}<p class="post-summary">{{ . }}</p>{{ end }}
  </li>
  {{ end }}
</ul>
{{ template "_internal/pagination.html" . }}
{{ end }}
{{ end }}
