{{ define "main" }}
<h1>Posts tagged "{{ .Title }}"</h1>
<ul class="post-list">
  {{ range .Pages }}
  <li class="post-item">
    <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006-01-02" }}</time>
    <a href="{{ .Permalink }}">{{ .Title }}</a>
  </li>
  {{ end }}
</ul>
{{ end }}
